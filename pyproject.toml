[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "My FastAPI learning journey: day-by-day code, commented code, and study notes"
readme = "README.md"
authors = [
    { name = "Eyad alayed", email = "eyadalayed1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.48",
]

[project.scripts]
fastapi-tutorial = "fastapi_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
